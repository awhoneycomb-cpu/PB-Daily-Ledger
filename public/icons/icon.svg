<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Ledger Book Base -->
  <g filter="url(#shadow)">
    <!-- Book cover back -->
    <rect x="96" y="96" width="320" height="320" rx="24" fill="#0f172a" />
    <!-- Book cover front -->
    <rect x="108" y="108" width="296" height="296" rx="20" fill="#1e293b" />
    <!-- Golden Spine Bar -->
    <rect x="108" y="108" width="36" height="296" rx="8" fill="url(#goldGrad)" />
  </g>

  <!-- Ledger Lines -->
  <line x1="168" y1="160" x2="376" y2="160" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5" />
  <line x1="168" y1="208" x2="340" y2="208" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5" />
  <line x1="168" y1="256" x2="360" y2="256" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- PKR Cash Symbol Badge -->
  <circle cx="340" cy="330" r="64" fill="url(#goldGrad)" filter="url(#shadow)" />
  <text x="340" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#1e293b" text-anchor="middle">Rs</text>

  <!-- Up/Down Cash Arrows -->
  <path d="M 180 340 L 180 296 M 168 308 L 180 296 L 192 308" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 224 296 L 224 340 M 212 328 L 224 340 L 236 328" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
